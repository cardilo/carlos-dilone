  <ellipse cx="355" cy="270" rx="12" ry="7" fill="#9CA6B2"/>
  <rect x="353" y="200" width="4"   height="70"  fill="#9AA4B0"/>
  <!-- Antenna tip -->
  <rect x="354" y="120" width="2"   height="82"  fill="#9EA8B4"/>
  <!-- Antenna top dot -->
  <circle cx="355" cy="118" r="2" fill="#9EA8B4"/>

  <!-- ── RIGHT BUILDINGS ────────────────────────────────── -->
  <rect x="375" y="365" width="75"  height="255" fill="url(#bldD)" rx="1"/>
  <rect x="373" y="360" width="79"  height="8"   fill="#B5C0CB" rx="1"/>
  <!-- windows -->
  <rect x="383" y="375" width="9"   height="11"  fill="#C4CED8" opacity="0.5"/>
  <rect x="398" y="375" width="9"   height="11"  fill="#C4CED8" opacity="0.5"/>
  <rect x="413" y="375" width="9"   height="11"  fill="#C4CED8" opacity="0.5"/>
  <rect x="428" y="375" width="9"   height="11"  fill="#C4CED8" opacity="0.5"/>
  <rect x="383" y="395" width="9"   height="11"  fill="#C4CED8" opacity="0.4"/>
  <rect x="398" y="395" width="9"   height="11"  fill="#C4CED8" opacity="0.4"/>
  <rect x="413" y="395" width="9"   height="11"  fill="#C4CED8" opacity="0.4"/>

  <rect x="445" y="340" width="60"  height="280" fill="url(#bldC)" rx="1"/>
  <rect x="443" y="335" width="64"  height="8"   fill="#A5B0BC" rx="1"/>
  <!-- Stepped top -->
  <rect x="450" y="310" width="47"  height="32"  fill="url(#bldC)" rx="1"/>
  <rect x="448" y="306" width="51"  height="7"   fill="#A2ADB9" rx="1"/>

  <rect x="500" y="355" width="80"  height="265" fill="url(#bldB)" rx="1"/>
  <rect x="498" y="350" width="84"  height="8"   fill="#B2BCC7" rx="1"/>

  <rect x="575" y="375" width="65"  height="245" fill="url(#bldD)" rx="1"/>
  <rect x="573" y="370" width="69"  height="8"   fill="#B5C0CB" rx="1"/>

  <!-- Rogers Centre (dome) -->
  <ellipse cx="650" cy="615" rx="80"  ry="22"  fill="#C0C9D2"/>
  <ellipse cx="650" cy="600" rx="78"  ry="40"  fill="#BEC7D0"/>
  <ellipse cx="650" cy="585" rx="72"  ry="45"  fill="#C4CDD6"/>
  <rect    x="578"  y="595"  width="144" height="25" fill="#BEC7D0"/>

  <rect x="640" y="380" width="70"  height="240" fill="url(#bldA)" rx="1"/>
  <rect x="638" y="375" width="74"  height="8"   fill="#B0BAC5" rx="1"/>

  <rect x="705" y="360" width="80"  height="260" fill="url(#bldC)" rx="1"/>
  <rect x="703" y="355" width="84"  height="8"   fill="#A5B0BC" rx="1"/>
  <rect x="712" y="370" width="10"  height="13"  fill="#BFCAD4" opacity="0.5"/>
  <rect x="729" y="370" width="10"  height="13"  fill="#BFCAD4" opacity="0.5"/>
  <rect x="746" y="370" width="10"  height="13"  fill="#BFCAD4" opacity="0.5"/>
  <rect x="763" y="370" width="10"  height="13"  fill="#BFCAD4" opacity="0.5"/>

  <rect x="780" y="390" width="60"  height="230" fill="url(#bldB)" rx="1"/>
  <rect x="778" y="385" width="64"  height="8"   fill="#B2BCC7" rx="1"/>

  <rect x="835" y="370" width="75"  height="250" fill="url(#bldD)" rx="1"/>
  <rect x="833" y="365" width="79"  height="8"   fill="#B5C0CB" rx="1"/>
  <!-- Stepped -->
  <rect x="845" y="345" width="53"  height="28"  fill="url(#bldD)" rx="1"/>
  <rect x="843" y="341" width="57"  height="7"   fill="#B0BAC5" rx="1"/>

  <rect x="905" y="385" width="65"  height="235" fill="url(#bldC)" rx="1"/>
  <rect x="903" y="380" width="69"  height="8"   fill="#A5B0BC" rx="1"/>

  <rect x="965" y="395" width="70"  height="225" fill="url(#bldB)" rx="1"/>
  <rect x="963" y="390" width="74"  height="8"   fill="#B0BAC5" rx="1"/>

  <rect x="1030" y="375" width="60" height="245" fill="url(#bldA)" rx="1"/>
  <rect x="1028" y="370" width="64" height="8"   fill="#AEB9C4" rx="1"/>

  <rect x="1085" y="395" width="70" height="225" fill="url(#bldD)" rx="1"/>
  <rect x="1083" y="390" width="74" height="8"   fill="#B5C0CB" rx="1"/>

  <rect x="1150" y="385" width="55" height="235" fill="url(#bldC)" rx="1"/>
  <rect x="1148" y="380" width="59" height="8"   fill="#A5B0BC" rx="1"/>

  <!-- ── GROUND LINE ─────────────────────────────────────── -->
  <rect x="0" y="618" width="1200" height="3" fill="#C8D0D8" opacity="0.5"/>

  <!-- ── LAKE ONTARIO (foreground) ──────────────────────── -->
  <rect x="0" y="620" width="1200" height="180" fill="url(#water)"/>

  <!-- Water shimmer lines -->
  <line x1="50"   y1="648" x2="180"  y2="648" stroke="#D8E4EE" stroke-width="1" opacity="0.5"/>
  <line x1="220"  y1="655" x2="380"  y2="655" stroke="#D8E4EE" stroke-width="1" opacity="0.4"/>
  <line x1="420"  y1="644" x2="560"  y2="644" stroke="#D8E4EE" stroke-width="1" opacity="0.5"/>
  <line x1="600"  y1="658" x2="750"  y2="658" stroke="#D8E4EE" stroke-width="1" opacity="0.4"/>
  <line x1="780"  y1="646" x2="920"  y2="646" stroke="#D8E4EE" stroke-width="1" opacity="0.5"/>
  <line x1="950"  y1="660" x2="1100" y2="660" stroke="#D8E4EE" stroke-width="1" opacity="0.4"/>
  <line x1="100"  y1="670" x2="260"  y2="670" stroke="#D8E4EE" stroke-width="0.8" opacity="0.3"/>
  <line x1="500"  y1="672" x2="680"  y2="672" stroke="#D8E4EE" stroke-width="0.8" opacity="0.3"/>
  <line x1="820"  y1="668" x2="980"  y2="668" stroke="#D8E4EE" stroke-width="0.8" opacity="0.3"/>

  <!-- Building reflections in water (very subtle) -->
  <rect x="340" y="622" width="30" height="40" fill="#B8C4D0" opacity="0.08"/>
  <rect x="353" y="622" width="4"  height="60" fill="#A8B4C0" opacity="0.06"/>

  <!-- ── VIGNETTE (left edge, blends into white) ─────────── -->
  <defs>
    <linearGradient id="vignL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#F8F7F5" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F8F7F5" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="180" height="800" fill="url(#vignL)"/>
</svg>
