<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky gradient: warm cream to soft blue-gray -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#E8EDF4"/>
      <stop offset="55%"  stop-color="#F0EDE8"/>
      <stop offset="100%" stop-color="#F5F2EC"/>
    </linearGradient>
    <!-- Water gradient -->
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#D8E2EC" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#E8EDF4" stop-opacity="0.3"/>
    </linearGradient>
    <!-- Building gradients -->
    <linearGradient id="bldA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#B8C4D0"/>
      <stop offset="100%" stop-color="#C8D3DC"/>
    </linearGradient>
    <linearGradient id="bldB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#C4CDD8"/>
      <stop offset="100%" stop-color="#D4DCE4"/>
    </linearGradient>
    <linearGradient id="bldC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#A8B4C0"/>
      <stop offset="100%" stop-color="#B8C2CC"/>
    </linearGradient>
    <linearGradient id="bldD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#BFC8D4"/>
      <stop offset="100%" stop-color="#CDD5DE"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#9AA4B0"/>
      <stop offset="100%" stop-color="#AAB4C0"/>
    </linearGradient>
    <!-- Sun glow -->
    <radialGradient id="sun" cx="72%" cy="22%" r="30%">
      <stop offset="0%"   stop-color="#F5E8D0" stop-opacity="0.7"/>
      <stop offset="60%"  stop-color="#EDE5D5" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#E8EDF4"  stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="800" fill="url(#sky)"/>

  <!-- Sun glow -->
  <rect width="1200" height="800" fill="url(#sun)"/>

  <!-- Subtle horizon haze -->
  <ellipse cx="600" cy="620" rx="700" ry="120" fill="#EDE8E0" opacity="0.25"/>

  <!-- ── BACKGROUND BUILDINGS (far, light) ─────────────── -->
  <rect x="0"   y="460" width="65"  height="160" fill="#D4DAE2" rx="1"/>
  <rect x="60"  y="440" width="50"  height="180" fill="#CDD4DC" rx="1"/>
  <rect x="105" y="470" width="55"  height="150" fill="#D0D7DF" rx="1"/>
  <rect x="155" y="450" width="40"  height="170" fill="#C8CFD8" rx="1"/>
  <rect x="190" y="455" width="70"  height="165" fill="#D2D9E1" rx="1"/>
  <rect x="255" y="430" width="45"  height="190" fill="#C5CCD5" rx="1"/>
  <rect x="295" y="445" width="60"  height="175" fill="#CDD4DC" rx="1"/>

  <!-- Far right background -->
  <rect x="870"  y="455" width="55"  height="165" fill="#D0D7DF" rx="1"/>
  <rect x="920"  y="440" width="60"  height="180" fill="#CAD1DA" rx="1"/>
  <rect x="975"  y="460" width="50"  height="160" fill="#D4DAE2" rx="1"/>
  <rect x="1020" y="445" width="65"  height="175" fill="#CDD4DC" rx="1"/>
  <rect x="1080" y="455" width="55"  height="165" fill="#D0D7DF" rx="1"/>
  <rect x="1130" y="448" width="70"  height="172" fill="#C8CFD8" rx="1"/>

  <!-- ── MIDGROUND BUILDINGS ────────────────────────────── -->
  <!-- Left cluster -->
  <rect x="10"  y="400" width="55"  height="220" fill="url(#bldB)" rx="1"/>
  <rect x="8"   y="395" width="57"  height="8"   fill="#BBC4CD" rx="1"/><!-- parapet -->

  <rect x="65"  y="370" width="70"  height="250" fill="url(#bldA)" rx="1"/>
  <rect x="63"  y="365" width="74"  height="8"   fill="#B0BAC5" rx="1"/>
  <!-- windows -->
  <rect x="72"  y="380" width="8"   height="10"  fill="#C8D4DF" opacity="0.6"/>
  <rect x="86"  y="380" width="8"   height="10"  fill="#C8D4DF" opacity="0.6"/>
  <rect x="100" y="380" width="8"   height="10"  fill="#C8D4DF" opacity="0.6"/>
  <rect x="72"  y="398" width="8"   height="10"  fill="#C8D4DF" opacity="0.5"/>
  <rect x="86"  y="398" width="8"   height="10"  fill="#C8D4DF" opacity="0.5"/>
  <rect x="100" y="398" width="8"   height="10"  fill="#C8D4DF" opacity="0.5"/>

  <rect x="130" y="350" width="80"  height="270" fill="url(#bldC)" rx="1"/>
  <rect x="128" y="345" width="84"  height="8"   fill="#A5B0BC" rx="1"/>
  <rect x="138" y="360" width="10"  height="12"  fill="#C0CAD4" opacity="0.5"/>
  <rect x="155" y="360" width="10"  height="12"  fill="#C0CAD4" opacity="0.5"/>
  <rect x="172" y="360" width="10"  height="12"  fill="#C0CAD4" opacity="0.5"/>
  <rect x="138" y="380" width="10"  height="12"  fill="#C0CAD4" opacity="0.4"/>
  <rect x="155" y="380" width="10"  height="12"  fill="#C0CAD4" opacity="0.4"/>
  <rect x="172" y="380" width="10"  height="12"  fill="#C0CAD4" opacity="0.4"/>

  <rect x="205" y="335" width="65"  height="285" fill="url(#bldD)" rx="1"/>
  <rect x="203" y="330" width="69"  height="8"   fill="#B8C2CC" rx="1"/>

  <rect x="265" y="355" width="75"  height="265" fill="url(#bldB)" rx="1"/>
  <rect x="263" y="350" width="79"  height="8"   fill="#B5C0CB" rx="1"/>

  <!-- Setback tower -->
  <rect x="280" y="310" width="45"  height="50"  fill="url(#bldA)" rx="1"/>
  <rect x="278" y="306" width="49"  height="7"   fill="#AEB9C4" rx="1"/>

  <!-- ── CN TOWER (hero element) ────────────────────────── -->
  <!-- Base / pedestal -->
  <polygon points="345,618 365,618 375,490 335,490" fill="url(#tower)"/>
  <!-- Main shaft -->
  <polygon points="350,490 360,490 357,200 353,200"  fill="url(#tower)"/>
  <!-- Pod / observation deck -->
  <rect x="340" y="330" width="30"  height="22"  fill="#9AA4B0" rx="2"/>
  <rect x="342" y="326" width="26"  height="6"   fill="#A4AEB8" rx="1"/>
  <rect x="342" y="352" width="26"  height="4"   fill="#8E98A4" rx="1"/>
